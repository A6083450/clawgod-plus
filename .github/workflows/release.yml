name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Project policy: never run JS-based actions on Node 20 — they're already
# deprecated and forced off after 2026-06-02. Pin every action that runs
# JS (actions/checkout etc.) to Node 24 across all our workflows.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun (canary)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Verify installers are freshly generated
        run: bun build.mjs --check

      - name: Build release notes without system Git
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentTag = context.ref.replace('refs/tags/', '');
            const { data: tags } = await github.rest.repos.listTags({ owner, repo, per_page: 100 });
            const index = tags.findIndex((entry) => entry.name === currentTag);
            const previousTag = index >= 0 ? tags[index + 1]?.name : undefined;
            const previousTagSha = previousTag ? tags[index + 1]?.commit?.sha : undefined;
            let commits;
            if (previousTag) {
              // GitHub fork 的 compare API 持续 404（known issue），改用
              // listCommits 获取当前 tag 的提交历史，手动截取到 previousTag。
              const history = await github.rest.repos.listCommits({
                owner,
                repo,
                sha: currentTag,
                per_page: 100,
              });
              const previousIndex = history.data.findIndex((entry) => entry.sha === previousTagSha);
              commits = previousIndex >= 0 ? history.data.slice(0, previousIndex) : history.data;
            } else {
              const history = await github.rest.repos.listCommits({ owner, repo, sha: currentTag, per_page: 100 });
              commits = history.data;
            }
            const lines = [
              '## Changes',
              '',
              ...commits.map((entry) => `- ${entry.commit.message.split('\n')[0]} (${entry.sha.slice(0, 7)})`),
              '',
              '## Install',
              '',
              '**macOS / Linux:**',
              '```bash',
              `curl -fsSL https://github.com/${owner}/${repo}/releases/download/${currentTag}/install.sh | bash`,
              '```',
              '',
              '**Windows (PowerShell):**',
              '```powershell',
              `irm https://github.com/${owner}/${repo}/releases/download/${currentTag}/install.ps1 | iex`,
              '```',
            ];
            if (previousTag) {
              lines.push('', `**Full changelog:** https://github.com/${owner}/${repo}/compare/${previousTag}...${currentTag}`);
            }
            fs.writeFileSync('release-notes.md', `${lines.join('\n')}\n`, 'utf8');


      - name: Inject version from tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "Injecting version: $ver"
          sed -i "s/^CLAWGOD_SELF_VERSION=\".*\"/CLAWGOD_SELF_VERSION=\"${ver}\"/" dist/unix/install.sh
          sed -i "s/^\\\$ClawSelfVersion = \"[^\"]*\"/\$ClawSelfVersion = \"${ver}\"/" dist/win/install.ps1
          grep 'CLAWGOD_SELF_VERSION=' dist/unix/install.sh | head -1
          grep 'ClawSelfVersion' dist/win/install.ps1 | head -1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Upload from inside each platform directory so release assets keep their
          # stable basenames (install.sh, install.ps1, apply-claude-code-chrome-fix.*).
          if gh release view "$tag" >/dev/null 2>&1; then
            (cd dist/unix && gh release upload "$tag" install.sh apply-claude-code-chrome-fix.sh --clobber)
            (cd dist/win && gh release upload "$tag" install.ps1 apply-claude-code-chrome-fix.ps1 --clobber)
          else
            gh release create "$tag" \
              --title "ClawGod Plus $tag" \
              --notes-file release-notes.md
            (cd dist/unix && gh release upload "$tag" install.sh apply-claude-code-chrome-fix.sh)
            (cd dist/win && gh release upload "$tag" install.ps1 apply-claude-code-chrome-fix.ps1)
          fi
